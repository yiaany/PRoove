name: PRoove — AI-assisted regression proof

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: proove-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  proove-review:
    name: PRoove review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install bot dependencies
        run: npm ci --ignore-scripts

      - name: Build bot
        run: npm run build

      - name: Fetch PR head for proof worktrees
        run: git fetch origin "${{ github.event.pull_request.head.sha }}"

      - name: Run PRoove review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_MODEL: ${{ secrets.OPENAI_COMPAT_MODEL }}
        run: node dist/bot/cli.js
